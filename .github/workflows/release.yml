name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '.github/**'
      - 'scripts/**'
      - 'packages/ui/openapi2ts.config.ts'
      - 'packages/ui/openapi-templates/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, and publish frontend artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.1-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.1-

      - name: Install locked dependencies without interactive prepare
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run workspace Biome checks
        run: bun run check

      - name: Test applications, shared UI, API proxies, and release contracts
        run: |
          set -euo pipefail
          (cd packages/ui && NODE_ENV=test bun run test)
          (cd apps/admin && NODE_ENV=test bun run test)
          (cd apps/user && NODE_ENV=test bun run test)
          NODE_ENV=test bun test tests/functions/pages-proxy.test.ts tests/functions/api-dev-proxy.test.ts
          node --test scripts/release-workflow.test.mjs scripts/release-dist-privacy.test.mjs scripts/swagger-contract.test.mjs scripts/openapi-source-contract.test.mjs scripts/openapi-generator-contract.test.mjs

      - name: Verify generated OpenAPI client
        run: bun run test:openapi

      - name: Validate the release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node - <<'JS'
          const assert = require('node:assert/strict')
          const version = require('./package.json').version
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'tag must match the package version')
          JS

      - name: Build and verify normal and API-prefixed releases
        run: bash scripts/build-release.sh "$PWD/release"

      - name: Retain build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppanel-frontend-${{ github.sha }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      # The built-in repository token works in forks; no personal GH_TOKEN secret
      # and no upstream semantic-release repository URL are required.
      - name: Publish this tag's assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          fail_on_unmatched_files: true
          files: |
            release/ppanel-admin-web.tar.gz
            release/ppanel-user-web.tar.gz
            release/ppanel-admin-web-with-api.tar.gz
            release/ppanel-user-web-with-api.tar.gz
            release/ppanel-admin-web.zip
            release/ppanel-user-web.zip
            release/SHA256SUMS
          body: |
            ## Structured routing and private runtime assets

            Adds structured Domain/GeoSite/RE2, IP/GeoIP/CIDR, and BitTorrent matchers for global blocks, per-server overrides, and ordered custom outbounds. Existing REALITY target PROXY (`reality_xver`) and inbound PROXY reception remain independent and fully supported.

            Use backend `v1.20.5` and ppnode `v1.1.15` from the matching r1172464137 fork releases. The node release carries pinned executable-relative GeoIP/GeoSite assets required by structured matchers.

            Remote sponsor cards and supplier fallbacks are removed. Tutorials are disabled by default unless a same-origin snapshot is configured; Monaco, icons, flags, and Lottie load locally.

            | Artifact | API route shape |
            | --- | --- |
            | `ppanel-admin-web.tar.gz` / `.zip` | Same-origin `/v1/` and `/v2/` |
            | `ppanel-user-web.tar.gz` / `.zip` | Same-origin `/v1/` and `/v2/` |
            | `*-with-api.tar.gz` | Same-origin `/api/v1/` and `/api/v2/`; requires an operator-owned target that strips `/api` |

            No archive embeds an API host or supplier fallback. All archives contain `index.html` at their root. `SHA256SUMS` covers every archive. Keep admin and user in separate static directories; the admin bundle may be served under a subdirectory such as `/admin/`.
